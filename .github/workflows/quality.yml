name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Lint, types, unit tests and Next.js build
        run: npm run check

      - name: Browser tests
        run: npm run test:e2e

      - name: Restore isolated Lighthouse runner
        uses: actions/cache@v5
        with:
          path: ${{ runner.temp }}/remainon-lighthouse-13.4.0
          key: lighthouse-${{ runner.os }}-node24-13.4.0

      - name: Install isolated Lighthouse runner
        env:
          LIGHTHOUSE_HOME: ${{ runner.temp }}/remainon-lighthouse-13.4.0
        run: |
          if [ ! -x "$LIGHTHOUSE_HOME/node_modules/.bin/lighthouse" ]; then
            npm install --prefix "$LIGHTHOUSE_HOME" --no-save --package-lock=false --ignore-scripts --audit=false --fund=false lighthouse@13.4.0
          fi

      - name: Lighthouse budgets
        timeout-minutes: 5
        env:
          LIGHTHOUSE_BIN: ${{ runner.temp }}/remainon-lighthouse-13.4.0/node_modules/.bin/lighthouse
        run: npm run lighthouse:ci

      - name: Store quality reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  preview:
    name: Gated Vercel preview
    needs: quality
    if: github.event_name == 'pull_request' && vars.ENABLE_VERCEL_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull protected preview settings
        run: npx --yes vercel@56.1.0 pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: npx --yes vercel@56.1.0 build --token="$VERCEL_TOKEN"

      - name: Deploy preview artifact
        id: deploy
        run: |
          url=$(npx --yes vercel@56.1.0 deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Protected preview: $url" >> "$GITHUB_STEP_SUMMARY"

name: Quality

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned agent runtime
        run: npm run check:agent-runtime

      - name: Audit production dependencies
        run: npm run check:security

      - name: Install Chromium and WebKit
        run: npx playwright install --with-deps chromium webkit

      - name: Lint and types
        run: npm run lint && npm run typecheck

      - name: Unit test coverage thresholds
        run: npm run test:coverage

      - name: Next.js build
        run: npm run build

      - name: Contact form browser tests with enabled UI
        run: npm run test:e2e:contact

      - name: Browser tests
        run: npm run test:e2e

      - name: Lighthouse budgets
        timeout-minutes: 5
        run: npm run lighthouse:ci

      - name: Store quality reports
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: quality-reports-${{ github.run_attempt }}
          path: |
            playwright-report/
            test-results/
            .lighthouseci/
          if-no-files-found: ignore
          retention-days: 14

  preview:
    name: Gated Vercel preview
    needs: quality
    if: github.event_name == 'pull_request' && vars.ENABLE_VERCEL_PREVIEWS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: preview
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify pinned agent runtime
        run: npm run check:agent-runtime

      - name: Pull protected preview settings
        run: ./node_modules/.bin/vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build preview artifact
        run: ./node_modules/.bin/vercel build --token="$VERCEL_TOKEN"

      - name: Deploy preview artifact
        id: deploy
        run: |
          url=$(./node_modules/.bin/vercel deploy --prebuilt --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Protected preview: $url" >> "$GITHUB_STEP_SUMMARY"

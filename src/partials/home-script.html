<script>
const menu = document.getElementById("menuMovil");
const openMenuButtons = document.querySelectorAll("[data-menu-open]");
const closeMenuButton = menu.querySelector("[data-menu-close]");
let menuTrigger = null;

function setMenu(open, restoreFocus = true) {
  if (open) {
    menuTrigger = document.activeElement;
    menu.classList.add("abierto");
    menu.inert = false;
    menu.setAttribute("aria-hidden", "false");
    document.body.classList.add("menu-abierto");
    openMenuButtons.forEach((button) => button.setAttribute("aria-expanded", "true"));
    setTimeout(() => closeMenuButton.focus({ preventScroll: true }), 0);
    return;
  }
  menu.classList.remove("abierto");
  menu.inert = true;
  menu.setAttribute("aria-hidden", "true");
  document.body.classList.remove("menu-abierto");
  openMenuButtons.forEach((button) => button.setAttribute("aria-expanded", "false"));
  if (restoreFocus && menuTrigger instanceof HTMLElement) menuTrigger.focus();
}

openMenuButtons.forEach((button) => button.addEventListener("click", () => setMenu(true)));
closeMenuButton.addEventListener("click", () => setMenu(false));
menu.querySelectorAll("a[href^='#']").forEach((link) => link.addEventListener("click", () => {
  const target = document.querySelector(link.hash);
  setMenu(false, false);
  if (!target) return;
  target.setAttribute("tabindex", "-1");
  setTimeout(() => target.focus({ preventScroll: true }), 0);
  target.addEventListener("blur", () => target.removeAttribute("tabindex"), { once: true });
}));
document.addEventListener("keydown", (event) => {
  if (!menu.classList.contains("abierto")) return;
  if (event.key === "Escape") {
    event.preventDefault();
    setMenu(false);
    return;
  }
  if (event.key !== "Tab") return;
  const focusable = [...menu.querySelectorAll("a[href],button:not([disabled])")];
  const first = focusable[0];
  const last = focusable.at(-1);
  if (event.shiftKey && document.activeElement === first) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && document.activeElement === last) {
    event.preventDefault();
    first.focus();
  }
});

const contactForm = document.getElementById("formContacto");
if (contactForm) contactForm.addEventListener("submit", (event) => {
  event.preventDefault();
  if (!contactForm.reportValidity()) return;
  const data = new FormData(contactForm);
  location.href = contactForm.action
    + "?subject=" + encodeURIComponent("Solicitud de evaluación — " + data.get("nombre"))
    + "&body=" + encodeURIComponent(data.get("mensaje") + "\n\nContacto: " + data.get("nombre") + " <" + data.get("email") + ">");
});

const sticky = document.getElementById("stickyNav");
const hero = document.querySelector(".hero");
const setStickyVisible = (visible) => {
  sticky.classList.toggle("visible", visible);
  sticky.inert = !visible;
  sticky.setAttribute("aria-hidden", String(!visible));
};

if ("IntersectionObserver" in window) {
  const heroObserver = new IntersectionObserver(([entry]) => {
    setStickyVisible(!entry.isIntersecting && entry.boundingClientRect.bottom <= 0);
  });
  heroObserver.observe(hero);

  const sectionObserver = new IntersectionObserver((entries) => {
    entries.forEach((entry) => {
      const link = document.querySelector(`#stickyLinks a[data-sec="${entry.target.id}"]`);
      if (!link) return;
      link.classList.toggle("activo", entry.isIntersecting);
      if (entry.isIntersecting) link.setAttribute("aria-current", "location");
      else link.removeAttribute("aria-current");
    });
  }, { rootMargin: "-45% 0px -45% 0px", threshold: 0 });
  document.querySelectorAll("main section[id], .cierre").forEach((section) => sectionObserver.observe(section));
} else {
  const updateSticky = () => setStickyVisible(hero.getBoundingClientRect().bottom <= 0);
  addEventListener("scroll", updateSticky, { passive: true });
  updateSticky();
}

if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  const revealItems = [...document.querySelectorAll("main [data-reveal], .cierre [data-reveal], [data-stagger], [data-relato]")];
  revealItems.forEach((element) => element.classList.add("reveal-ready"));

  const reveal = (element, delay = 0) => {
    element.style.transitionDelay = `${delay}ms`;
    requestAnimationFrame(() => element.classList.add("is-visible"));
    const cleanup = () => {
      element.classList.remove("reveal-ready", "is-visible");
      element.style.removeProperty("transition-delay");
    };
    element.addEventListener("transitionend", cleanup, { once: true });
    setTimeout(cleanup, delay + 800);
  };

  if ("IntersectionObserver" in window) {
    const revealObserver = new IntersectionObserver((entries) => {
      let delay = 0;
      entries.filter((entry) => entry.isIntersecting).forEach((entry) => {
        reveal(entry.target, delay);
        delay = Math.min(delay + 40, 160);
        revealObserver.unobserve(entry.target);
      });
    }, { rootMargin: "0px 0px -8% 0px", threshold: 0.05 });
    revealItems.forEach((element) => revealObserver.observe(element));
  } else {
    revealItems.forEach((element) => reveal(element));
  }

  const repairedLine = document.getElementById("fisuraFija");
  const lineLength = repairedLine.getTotalLength();
  repairedLine.style.setProperty("--line-length", lineLength);
  repairedLine.classList.add("motion-ready");
  const showRepairedLine = () => {
    requestAnimationFrame(() => repairedLine.classList.add("is-visible"));
    repairedLine.addEventListener("transitionend", () => {
      repairedLine.classList.remove("motion-ready", "is-visible");
      repairedLine.style.removeProperty("--line-length");
    }, { once: true });
  };
  if ("IntersectionObserver" in window) {
    const lineObserver = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      showRepairedLine();
      lineObserver.disconnect();
    }, { threshold: 0.2 });
    lineObserver.observe(repairedLine);
  } else {
    showRepairedLine();
  }
}
</script>
